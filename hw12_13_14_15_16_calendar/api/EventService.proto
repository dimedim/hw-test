syntax = "proto3";

package event;
option go_package = "github.com/dimedim/hw-test/hw12_13_14_15_16_calendar/api/grpcevents;grpcevents";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";


message Event {
  string id = 1;
  string title = 2;
  google.protobuf.Timestamp starts_at = 3;
  google.protobuf.Timestamp ends_at = 4;
  string description = 5;
  string user_id = 6;
  google.protobuf.Duration notify_offset = 7;
}

message CreateEventRequest {
  Event event = 1;
}
message CreateEventResponse {
  Event event = 1;
}

message UpdateEventRequest {
  string event_id = 1;
  Event event = 2;
}

message UpdateEventResponse {
  Event event = 1;
}

message DeleteEventRequest {
  string event_id = 1;
}

message DeleteEventResponse {
  google.protobuf.Empty empty = 1;
}

message ListDayRequest {
  google.protobuf.Timestamp date = 1;
  string user_id = 2;
}
message ListDayResponse {
  repeated Event events = 1;
}

message ListWeekRequest {
  google.protobuf.Timestamp date = 1;
  string user_id = 2;
}
message ListWeekResponse {
  repeated Event events = 1;
}

message ListMonthRequest {
  google.protobuf.Timestamp date = 1;
  string user_id = 2;
}
message ListMonthResponse {
  repeated Event events = 1;
}

service CalendarService {
  rpc CreateEvent(CreateEventRequest) returns (CreateEventResponse);
  rpc UpdateEvent(UpdateEventRequest) returns (UpdateEventResponse);
  rpc DeleteEvent(DeleteEventRequest) returns (google.protobuf.Empty);
  rpc ListDay(ListDayRequest) returns (ListDayResponse);
  rpc ListWeek(ListWeekRequest) returns (ListWeekResponse);
  rpc ListMonth (ListMonthRequest) returns (ListMonthResponse);
}